[package]
name = "localpdf-studio"
version = "1.0.0"
description = "LocalPDF Studio - edit PDFs in your browser (Tauri 2 desktop shell)"
authors = ["LocalPDF Studio contributors"]
edition = "2021"
rust-version = "1.77.2"

# Avoid multiple binaries in the dist folder.
[lib]
name = "localpdf_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
strip = true
