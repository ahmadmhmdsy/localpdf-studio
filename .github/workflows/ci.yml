name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.14.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Enable Corepack and activate npm
        run: |
          corepack enable npm
          corepack prepare npm@11.16.0 --activate
      - name: Verify pinned runtime
        run: |
          test "$(node --version)" = "v22.14.0"
          test "$(npm --version)" = "11.16.0"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests and coverage
        run: npm run test:coverage
      - run: npm run build
      - name: Install Chromium for browser gates
        run: npx playwright install --with-deps chromium
      - name: Production browser smoke and accessibility gates
        run: npm run test:e2e
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
      - name: Install Linux Rust dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Check Rust crate
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
